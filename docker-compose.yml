services:
  backend:
    image: backend
    build:
      context: ./app/backend/backend
    environment:
      ASPNETCORE_ENVIRONMENT: PRODUCTION
      ASPNETCORE_WEBROOTPATH: wwwroot
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=delivery_management;Username=postgres;Password=postgres11;
    volumes:
      ./.containers/images:wwwroot
    depends_on:
      db:
        condition: service_healthy
    user: root
  frontend:
    image: frontend
    build:
      context: ./app/frontend
  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    depends_on:
      - backend
      - frontend
  db:
    image: postgres:17
    environment:
      - POSTGRES_DB=delivery_management
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres11
    volumes:
      - ./.containers/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
