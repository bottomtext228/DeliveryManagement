services:
  deliverymanagement_backend:
    image: backend
    build:
      context: ./app/backend/backend
    environment:
      ASPNETCORE_ENVIRONMENT: PRODUCTION
      SEED_TEST_DATA: ${SEED_TEST_DATA}
      ConnectionStrings__DefaultConnection: Host=deliverymanagement_db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      JWT__SecretKey: ${JWT_SECRETKEY}
    volumes:
      - ./.containers/backend/images:/app/wwwroot/images
      - ./.containers/backend/keys:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      deliverymanagement_db:
        condition: service_healthy
    user: root
  deliverymanagement_frontend:
    image: frontend
    build:
      context: ./app/frontend
  deliverymanagement_proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    depends_on:
      deliverymanagement_backend:
        condition: service_healthy
      deliverymanagement_frontend:
        condition: service_started
  deliverymanagement_db:
    image: postgres:17
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./.containers/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
