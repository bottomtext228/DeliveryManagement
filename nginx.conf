worker_processes 4;

events { worker_connections 1024; }

http {
	server {
		listen 80;
 
		proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
		
		location /api/ { 
			proxy_pass http://deliverymanagement_backend:8080/api/;
		}

		location /images/ {
			proxy_pass http://deliverymanagement_backend:8080/images/;
		}

		location /health {
			proxy_pass http://deliverymanagement_backend:8080/health;
		}

		location / {
			proxy_pass http://deliverymanagement_frontend:3000/;
    	}
	}
}